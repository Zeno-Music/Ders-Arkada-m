name: Ders Arkadasim Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          # Android Gradle Plugin 8.7.3 requires Gradle 8.9 or newer.
          gradle-version: '8.9'

      - name: APK olustur ve kaynaklari kontrol et
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace

      - name: APK imzasini ve paketini dogrula
        shell: bash
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | tee apk-info.txt
          grep -F "package: name='com.dersarkadasim.app'" apk-info.txt
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml | tee apk-manifest.txt
          grep -F 'Ders Arkadaşım' apk-manifest.txt
          mkdir -p dist
          cp "$APK" dist/Ders-Arkadasim-debug.apk
          cd dist
          sha256sum Ders-Arkadasim-debug.apk > SHA256SUMS.txt

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: DersArkadasim-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
